<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竹北托運排班</title>
<link rel="apple-touch-icon" href="icon-truck.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Crect width='240' height='240' rx='56' fill='%231c2a22'/%3E%3Crect x='56' y='62' width='128' height='28' rx='14' fill='%23f4f7f2'/%3E%3Crect x='106' y='62' width='28' height='116' rx='14' fill='%23f4f7f2'/%3E%3Crect x='40' y='150' width='160' height='28' rx='14' fill='%2306c755'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2ec; --card:#ffffff; --ink:#1c2a22; --sub:#5d6d63; --line:#06c755; --line-ink:#ffffff;
  --btn:#1c2a22; --btn-ink:#f4f7f2; --edge:#d3dcd2; --chip:#e3ebe1;
  --fo:#f3e3c3; --fo-ink:#5a3f08; --tw:#d6ecd9; --tw-ink:#16502a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a15; --card:#1b251f; --ink:#e8f0ea; --sub:#93a498; --btn:#e8f0ea; --btn-ink:#121a15; --edge:#2b3a31; --chip:#24322a;
    --fo:#3b2f14; --fo-ink:#f0d9a6; --tw:#1f3a28; --tw-ink:#b8e6c4;
  }
}
:root[data-theme="dark"]{
  --bg:#121a15; --card:#1b251f; --ink:#e8f0ea; --sub:#93a498; --btn:#e8f0ea; --btn-ink:#121a15; --edge:#2b3a31; --chip:#24322a;
  --fo:#3b2f14; --fo-ink:#f0d9a6; --tw:#1f3a28; --tw-ink:#b8e6c4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:28px 18px 40px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.brand svg{width:48px;height:48px;flex:none}
.lg-bg{fill:var(--btn)}
.lg-fg{fill:var(--btn-ink)}
.lg-ac{fill:var(--line)}
.brand h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:.04em}
.brand span{display:block;margin-top:2px;font-size:14px;color:var(--sub);letter-spacing:.25em}
button,a.btn,input{font:inherit}
button{cursor:pointer;border:0}
button:focus-visible,a.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--line);outline-offset:2px}
button[disabled]{opacity:.4;pointer-events:none}
.big{display:block;width:100%;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:600;text-align:center;text-decoration:none}
#go{background:var(--btn);color:var(--btn-ink);font-size:20px;padding:18px}
#go:active{transform:scale(.98)}
.result{margin:20px 0 14px;background:var(--card);border:1.5px solid var(--edge);border-radius:14px;padding:6px 0;min-height:84px}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;font-size:30px;font-weight:700}
.row+.row{border-top:1px solid var(--edge)}
.row .n{font-size:15px;font-weight:600;color:var(--sub);background:var(--chip);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.row.pop{animation:pop .28s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row.pop{animation:none}}
.empty{color:var(--sub);text-align:center;padding:26px 10px;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#copy{background:var(--chip);color:var(--ink)}
a.btn.line{background:var(--line);color:var(--line-ink)}
a.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--sub);text-align:center}
details{margin-top:36px;border-top:1px solid var(--edge);padding-top:14px}
details+details{margin-top:14px}
summary{cursor:pointer;color:var(--sub);font-size:15px;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
p.hint{margin:10px 0 14px;color:var(--sub);font-size:13px;line-height:1.6}
.h{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge)}
.h small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.h b{font-size:18px;letter-spacing:.08em}
.hnone{color:var(--sub);font-size:13px;padding:10px 0}
.p{display:grid;grid-template-columns:1fr 62px auto 34px;gap:8px;align-items:center;margin-bottom:8px}
.nm{min-width:0;font-size:20px;text-align:center;padding:9px 4px;border:1.5px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink)}
.tp{border-radius:10px;padding:11px 0;font-size:15px;font-weight:600}
.tp.fo{background:var(--fo);color:var(--fo-ink)}
.tp.tw{background:var(--tw);color:var(--tw-ink)}
.nl{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);white-space:nowrap}
.nl input{width:18px;height:18px;accent-color:var(--line)}
.del{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--sub);font-size:14px}
#add{background:var(--chip);color:var(--ink);margin-top:4px;font-size:15px;padding:11px}
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg viewBox="0 0 240 240" role="img" aria-label="工作 logo">
      <rect class="lg-bg" width="240" height="240" rx="56"></rect>
      <rect class="lg-fg" x="56" y="62" width="128" height="28" rx="14"></rect>
      <rect class="lg-fg" x="106" y="62" width="28" height="116" rx="14"></rect>
      <rect class="lg-ac" x="40" y="150" width="160" height="28" rx="14"></rect>
    </svg>
    <div>
      <h1>工作</h1>
      <span>竹北托運排班</span>
    </div>
  </header>
  <button id="go" class="big">隨機排班</button>
  <div class="result" id="result"><div class="empty">按上面的按鈕開始</div></div>
  <div class="actions">
    <button id="copy" class="big" disabled>複製</button>
    <a class="btn big line" id="line" href="#" target="_blank" rel="noopener" aria-disabled="true">傳到 LINE</a>
  </div>
  <div id="msg" role="status"></div>

  <details id="histBox">
    <summary>歷史（<span id="hc">0</span>）</summary>
    <div id="hl"></div>
  </details>

  <details>
    <summary>設定</summary>
    <p class="hint">點「外籍／台灣」切換，勾「不排最後」的人不排最後。<br>台灣人不相鄰，含最後一位。</p>
    <div id="people"></div>
    <button id="add" class="big">＋ 新增人員</button>
  </details>
</main>
<script>
(function(){
  var KEY='roster-people-v1',HK='roster-history-v1',LK='roster-last-v1';
  var box=document.getElementById('people'),add=document.getElementById('add'),
      go=document.getElementById('go'),res=document.getElementById('result'),
      copyBtn=document.getElementById('copy'),lineBtn=document.getElementById('line'),
      msg=document.getElementById('msg'),hl=document.getElementById('hl'),hc=document.getElementById('hc');
  var text='',cur=null;

  function loadJ(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
  function saveJ(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  var people=loadJ(KEY);
  if(!Array.isArray(people)||!people.length){
    people=[{n:'賢',t:1,l:0},{n:'商',t:0,l:1},{n:'石',t:0,l:0},{n:'逸',t:1,l:0}];
  }
  var hist=loadJ(HK);
  if(!Array.isArray(hist))hist=[];

  function save(){saveJ(KEY,people);}

  function rand(n){
    try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}catch(e){return Math.floor(Math.random()*n);}
  }

  function stamp(){
    var d=new Date();
    function p(n){return (n<10?'0':'')+n;}
    return {w:'日一二三四五六'.charAt(d.getDay()),d:(d.getMonth()+1)+'/'+d.getDate(),t:p(d.getHours())+':'+p(d.getMinutes())};
  }

  function drawHist(){
    hl.innerHTML='';
    hc.textContent=hist.length;
    if(!hist.length){
      var e=document.createElement('div');e.className='hnone';e.textContent='還沒有紀錄，複製或傳到 LINE 後會記在這裡。';
      hl.appendChild(e);return;
    }
    hist.forEach(function(h,i){
      var r=document.createElement('div');r.className='h';
      var c=document.createElement('div');
      var s=document.createElement('small');
      s.textContent='週'+h.w+' '+h.d+' '+h.t+' · '+h.how.join('、');
      var b=document.createElement('b');b.textContent=h.o.join(' ');
      c.appendChild(s);c.appendChild(b);
      var del=document.createElement('button');
      del.type='button';del.className='del';del.textContent='✕';
      del.setAttribute('aria-label','刪除這筆紀錄');
      del.addEventListener('click',function(){hist.splice(i,1);saveJ(HK,hist);drawHist();});
      r.appendChild(c);r.appendChild(del);
      hl.appendChild(r);
    });
  }

  function logSend(how){
    if(!cur)return;
    if(cur.entry&&hist.indexOf(cur.entry)>=0){
      if(cur.entry.how.indexOf(how)<0)cur.entry.how.push(how);
    }else{
      var s=stamp();
      cur.entry={w:s.w,d:s.d,t:s.t,o:cur.order.slice(),how:[how]};
      hist.unshift(cur.entry);
      if(hist.length>60)hist.length=60;
    }
    saveJ(HK,hist);drawHist();
  }

  function draw(){
    box.innerHTML='';
    people.forEach(function(p,i){
      var r=document.createElement('div');r.className='p';

      var nm=document.createElement('input');
      nm.className='nm';nm.value=p.n;nm.maxLength=8;
      nm.setAttribute('aria-label','名字 '+(i+1));
      nm.addEventListener('input',function(){p.n=nm.value;save();});

      var tp=document.createElement('button');
      tp.type='button';tp.className='tp '+(p.t?'tw':'fo');
      tp.textContent=p.t?'台灣':'外籍';
      tp.setAttribute('aria-label','切換外籍或台灣');
      tp.addEventListener('click',function(){p.t=p.t?0:1;save();draw();});

      var lb=document.createElement('label');lb.className='nl';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!p.l;
      cb.addEventListener('change',function(){p.l=cb.checked?1:0;save();});
      lb.appendChild(cb);lb.appendChild(document.createTextNode('不排最後'));

      var del=document.createElement('button');
      del.type='button';del.className='del';del.textContent='✕';
      del.setAttribute('aria-label','刪除');
      del.addEventListener('click',function(){people.splice(i,1);save();draw();});

      r.appendChild(nm);r.appendChild(tp);r.appendChild(lb);r.appendChild(del);
      box.appendChild(r);
    });
    add.disabled=people.length>=8;
  }

  function solve(list){
    var n=list.length,out=[],used=[],c=[];
    function ok(p,pos){
      if(pos===n-1&&p.l)return false;
      if(pos>0&&c[pos-1].t&&p.t)return false;
      return true;
    }
    function dfs(pos){
      if(pos===n){out.push(c.slice());return;}
      for(var i=0;i<n;i++){
        if(used[i]||!ok(list[i],pos))continue;
        used[i]=true;c.push(list[i]);
        dfs(pos+1);
        c.pop();used[i]=false;
      }
    }
    dfs(0);
    return out;
  }

  function render(list){
    res.innerHTML='';
    list.forEach(function(name,i){
      var d=document.createElement('div');d.className='row pop';d.style.animationDelay=(i*70)+'ms';
      d.innerHTML='<span class="n">'+(i+1)+'</span><span></span>';
      d.lastChild.textContent=name;
      res.appendChild(d);
    });
  }

  add.addEventListener('click',function(){
    people.push({n:'',t:0,l:0});save();draw();
    var ins=box.querySelectorAll('.nm');ins[ins.length-1].focus();
  });

  go.addEventListener('click',function(){
    var list=people.filter(function(p){return p.n.trim();})
      .map(function(p){return {n:p.n.trim(),t:p.t,l:p.l};});
    if(list.length<2){msg.textContent='至少要有兩個名字。';return;}
    var all=solve(list);
    if(!all.length){
      msg.textContent='這組條件排不出來，打開下面的設定檢查外籍／台灣和「不排最後」。';
      return;
    }
    var last=loadJ(LK);
    if(last&&all.length>1){
      var f=all.filter(function(o){return o.map(function(p){return p.n;}).join('|')!==last;});
      if(f.length)all=f;
    }
    var order=all[rand(all.length)].map(function(p){return p.n;});
    saveJ(LK,order.join('|'));
    cur={order:order,entry:null};
    render(order);
    text=order.join('\n');
    copyBtn.disabled=false;
    lineBtn.removeAttribute('aria-disabled');
    lineBtn.href='https://line.me/R/msg/text/?'+encodeURIComponent(text);
    msg.textContent='';
  });

  copyBtn.addEventListener('click',function(){
    function ok(){msg.textContent='已複製，貼到 LINE 就可以了。';logSend('複製');}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      var done=false;
      try{done=document.execCommand('copy');}catch(e){}
      document.body.removeChild(ta);
      if(done)ok();else msg.textContent='複製失敗，請改用傳到 LINE。';
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);}else{fallback();}
  });

  lineBtn.addEventListener('click',function(){
    if(lineBtn.getAttribute('aria-disabled')==='true')return;
    logSend('LINE');
  });

  draw();
  drawHist();
})();
</script>
</body>
</html>
